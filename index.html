  alert: { fg: "var(--alert)", bg: "var(--alert-bg)" },
  moved: { fg: "var(--warn)",  bg: "var(--warn-bg)" },
  calm:  { fg: "var(--calm)",  bg: "var(--calm-bg)" },
  unknown: { fg: "var(--muted)", bg: "var(--bg)" },
};

function ago(iso) {
  if (!iso) return T().agoNone;
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return T().agoNow;
  if (m < 60) return m + T().agoM;
  const h = Math.round(m / 60);
  if (h < 24) return h + T().agoH;
  return Math.round(h / 24) + T().agoD;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function fmtN(v, unit) {
  return v == null ? "—" : (v > 0 ? "+" : "") + v + unit;
}

function fmtAbs(iso) {
  // 절대 시각 (로컬 기준) — 오늘이면 시:분, 아니면 날짜 포함
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  const sameDay = new Date().toDateString() === d.toDateString();
  const loc = LANG === "ko" ? "ko-KR" : "en-US";
  return sameDay
    ? d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleString(loc, { month: "short", day: "numeric",
                              hour: "2-digit", minute: "2-digit" });
}

// 시나리오별 구성 조건 (서버 classify_scenario 의 판별식과 동일한 매핑 — 표시용)
const SC_CONDS = {
  // s1 은 narrowing_bull(축소 + 10년물 하락). 조건 **2개를 유지**해야 합니다 —
  // 아래 부분충족 타이브레이크가 시나리오 간 길이 정규화 없이 met 개수를
  // 비교하므로, s1 만 3개가 되면 '기우는 중' 점선이 s1 쪽으로 편향됩니다.
  s1: ["yen_fast", "narrowing_bull"],
  s2: ["rates_down_w", "yen_calm"],
  s3: ["widening", "yen_calm"],
  s4: ["yen_back", "flat_spread"],
  s5: ["dollar_down", "rates_up_today"],
};

// ── 여정표 (Journey Board) — 이번 주 일정 + 실측 결과 도착 ──
// 서버(journey_payload)가 상태·문구·판정을 전부 계산해 내려보내고,
// 여기서는 그리기만 합니다. 펼침 상태는 60초 재렌더에서 살아남게 전역 보관.
let JR_OPEN = false;
const JR_SHOW = { detail: new Set(), terms: new Set() };
const SCEN_CH = { A: "Ⓐ", B: "Ⓑ", C: "Ⓒ" };
const JR_GLYPH = { scheduled: "○", awaiting: "◐", session: "◐",
  arrived: "✔", past: "✔", failed: "!" };
const JR_CHIP_S = { calm: "calm", warn: "moved", alert: "alert" };

function jrChip(c) {
  if (!c) return "";
  const s = S[JR_CHIP_S[c.level]] || S.unknown;
  return `<span class="pill" style="color:${s.fg};background:${s.bg}">${esc(c.text)}</span>`;
}

function jrTable(d, cols) {
  const head = `<tr><td class="k"></td>` + (cols || []).map(c =>
    `<td style="color:var(--muted)">${esc(c)}</td>`).join("") + `</tr>`;
  const rows = (d.rows || []).map(r =>
    `<tr><td class="k">${esc(r[0])}</td><td class="num">${esc(r[1])}</td>
     <td class="num" style="font-weight:600">${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("");
  const foot = (d.foot || []).map(f => `<div class="jrfoot">${esc(f)}</div>`).join("");
  return `<table class="jrtbl">${head}${rows}</table>${foot}`;
}

function renderJourney(p) {
  const el = document.getElementById("journey");
  if (!el) return;
  const j = p.journey;
  const JT = T().jr;
  // 달력이 바닥난 경우 — 무음 소멸 대신 갱신 안내 (조용한 주와 구분)
  if (j && (!j.entries || !j.entries.length)) {
    el.innerHTML = j.stale ? `<div class="panel"><h2>${esc(JT.title)}</h2>
      <div style="font-size:13px;color:var(--mid)">${esc(JT.stale(j.stale))}</div>
    </div>` : "";
    return;
  }
  if (!j) { el.innerHTML = ""; return; }
  const now = Date.now();
  const ent = j.entries;

  // 헤더 스트립 — 3초 질문("방금 무슨 일이? 다음은?")에 대한 문장 답.
  // '방금 도착'은 결과가 실제로 도착한 것만: arrived, 또는 결정이 내려진
  // 중앙은행(past). 수집 실패·memo 를 '도착'이라 부르면 허위 문장입니다.
  const lastA = [...ent].reverse().find(e =>
    new Date(e.dt) <= now && (e.status === "arrived"
      || (e.status === "past" && e.type === "central_bank")));
  // '다음 도착'은 결과가 실제로 도착하는 이벤트만 (memo 는 자동 수집 없음)
  const nextU = ent.find(e => e.status === "awaiting" || e.status === "session")
    || ent.find(e => new Date(e.dt) > now && e.type !== "memo");
  const nextRel = !nextU ? "" : (nextU.status === "awaiting" ? JT.waiting
    : JT.rel((new Date(nextU.dt) - now) / 60000));
  const strip = `<div class="jrstrip">
    <div><span class="k">${JT.lastArr}:</span> ${lastA
      ? `${esc(lastA.title)} ${jrChip(lastA.chip)} <span class="k jrtime">(${fmtAbs(lastA.dt)})</span>` : "—"}</div>
    <div><span class="k">${JT.nextUp}:</span> ${nextU
      ? `${esc(nextU.title)} · <span class="jrtime">${fmtAbs(nextU.dt)}</span> <span class="k">(${esc(nextRel)})</span>` : "—"}</div>
  </div>`;

  // 기본은 간추린 보기: 직전 결과 1 + 대기/다가올 4. 펼치면 전부.
  let rows;
  if (JR_OPEN) {
    rows = ent.slice();
  } else {
    rows = lastA ? [lastA] : [];
    rows = rows.concat(ent.filter(e => e !== lastA
      && (new Date(e.dt) > now || e.status === "awaiting"
          || e.status === "session")).slice(0, 4));
    rows.sort((a, b) => (a.dt < b.dt ? -1 : 1));
  }

  const loc = LANG === "ko" ? "ko-KR" : "en-US";
  const dhdr = iso => new Date(iso).toLocaleDateString(loc,
    { weekday: "short", month: "numeric", day: "numeric" });
  const nowHtml = `<div class="jrnow"><span class="jrg">▶</span>
    <span style="font-size:12px">${esc(JT.nowLine(fmtAbs(new Date(now).toISOString()),
      p.snapshot && p.snapshot.at ? fmtAbs(p.snapshot.at) : "—"))}</span></div>`;

  const rowHtml = e => {
    const g = JR_GLYPH[e.status] || "○";
    const gcol = ["arrived", "past"].includes(e.status) ? "var(--ink)" : "var(--muted)";
    const compact = JR_OPEN && (now - new Date(e.dt)) > 2 * 86400000;
    const scen = e.scen ? ` <span class="scen">${SCEN_CH[e.scen] || esc(e.scen)}</span>` : "";
    const btns = [];
    if (e.detail) btns.push(`<button class="rbtn jrb" data-k="detail" data-id="${esc(e.id)}">${JT.detail}</button>`);
    if (e.terms && e.terms.length && j.gloss)
      btns.push(`<button class="rbtn jrb" data-k="terms" data-id="${esc(e.id)}">${JT.terms}</button>`);
    if (e.url) btns.push(`<a class="rbtn" style="text-decoration:none"
      href="${esc(e.url)}" target="_blank" rel="noreferrer">${JT.src}</a>`);
    const detailHtml = e.detail && JR_SHOW.detail.has(e.id) ? jrTable(e.detail, j.cols) : "";
    const termsHtml = JR_SHOW.terms.has(e.id)
      ? (e.terms || []).map(k => (j.gloss || {})[k]).filter(Boolean).map(g2 =>
          `<div class="jrterm"><b>${esc(g2[0])}</b> — ${esc(g2[1])}</div>`).join("")
      : "";
    return `<div class="jrrow">
      <span class="jrg" style="color:${gcol}">${g}</span>
      <div class="jrmain">
        <div class="jrtop">
          <span class="jrtime">${fmtAbs(e.dt)}${e.local ? ` (${esc(e.local)})` : ""}</span>
          <span class="jrtitle">${esc(e.title)}</span>${scen} ${jrChip(e.chip)}
        </div>
        ${!compact && e.summary ? `<div class="jrsum">${esc(e.summary)}</div>` : ""}
        ${!compact && e.reading ? `<div class="jrread">${esc(e.reading)}</div>` : ""}
        ${!compact && e.why && e.status === "scheduled" ? `<div class="jrwhy">${esc(e.why)}</div>` : ""}
        ${!compact ? `<div class="jrbtns">${btns.join("")}</div>` : ""}
        ${detailHtml}${termsHtml}
      </div>
    </div>`;
  };

  const parts = [];
  let nowDone = false, lastDay = "";
  for (const e of rows) {
    if (!nowDone && new Date(e.dt) > now) { parts.push(nowHtml); nowDone = true; }
    const day = dhdr(e.dt);
    if (day !== lastDay) { parts.push(`<div class="jrdate">${esc(day)}</div>`); lastDay = day; }
    parts.push(rowHtml(e));
  }
  if (!nowDone) parts.push(nowHtml);

  el.innerHTML = `<div class="panel">
    <h2>${esc(JT.title)} <span style="font-weight:400;font-size:11px;color:var(--muted)">· ${esc(j.legend || "")}</span></h2>
    <div style="font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.7">${JT.eli}</div>
    ${strip}
    ${parts.join("")}
    <div class="jrbtns" style="margin-top:10px">
      <button class="rbtn" id="jr-toggle">${JR_OPEN ? JT.collapse : JT.expand}</button>
    </div>
    ${j.note ? `<div style="font-size:12px;color:var(--muted);margin-top:10px">ⓘ ${esc(j.note)}</div>` : ""}
    <div style="font-size:11px;color:var(--muted);margin-top:8px">${esc(j.panel_note || "")}</div>
  </div>`;

  const tgl = document.getElementById("jr-toggle");
  if (tgl) tgl.onclick = () => { JR_OPEN = !JR_OPEN; renderJourney(p); };
  el.querySelectorAll(".jrb").forEach(b => {
    b.onclick = () => {
      const set = JR_SHOW[b.dataset.k];
      if (set.has(b.dataset.id)) set.delete(b.dataset.id);
      else set.add(b.dataset.id);
      renderJourney(p);
    };
  });
}

// ── 환류 노선도 (hero) — 전달 경로 한 장에 전부 ─────────────
// 판정단 우승안(transmission-map) + 접목: 기우는 점선 경로, 램프 옆 실측치,
// 이벤트 깃발은 서버 payload.events 공급.
const HERO_ST = [
  { key: "jgb10y", x: 72 }, { key: "mof", x: 200 }, { key: "usdjpy", x: 328 },
  { key: "spread", x: 452, sw: true }, { key: "us30y", x: 576 }, { key: "dxy", x: 696 },
];
const HERO_BOX = [
  { id: "s1", x: 12 }, { id: "s4", x: 161 }, { id: "s3", x: 310 },
  { id: "s2", x: 460 }, { id: "s5", x: 609 },
];
const COND_X = { yen_fast: 328, yen_calm: 328, yen_back: 328,
  narrowing: 452, narrowing_bull: 452, narrowing_bear: 452,
  widening: 452, flat_spread: 452,
  rates_down_w: 576, dollar_down: 696, rates_up_today: 696 };
const ST_FG = { alert: "var(--alert)", moved: "var(--warn)",
  calm: "var(--calm)", unknown: "var(--muted)" };
const ST_GLYPH = { alert: "!", moved: "△", calm: "✓", unknown: "?" };

function condEvidence(cond, ev) {
  const map = {
    yen_fast: ["jpy_3bd", LANG === "ko" ? "엔" : "¥"],
    yen_calm: ["jpy_3bd", LANG === "ko" ? "엔" : "¥"],
    yen_back: ["jpy_3bd", LANG === "ko" ? "엔" : "¥"],
    narrowing: ["d_spread_w_bp", "bp"], widening: ["d_spread_w_bp", "bp"],
    // 불/베어를 가르는 근거는 금리차가 아니라 10년물 주간 변화입니다
    narrowing_bull: ["d_us10y_w_bp", "bp"], narrowing_bear: ["d_us10y_w_bp", "bp"],
    flat_spread: ["d_spread_w_bp", "bp"], rates_down_w: ["d_us30y_w_bp", "bp"],
    dollar_down: ["d_dxy_pct", "%"], rates_up_today: ["d_us10y_bp", "bp"],
  }[cond];
  if (!map || !ev) return null;
  return ev[map[0]] == null ? null : fmtN(ev[map[0]], map[1]);
}

function renderHero(p) {
  const el = document.getElementById("hero");
  if (!el) return;
  if (!p.rows || !p.rows.length) { el.innerHTML = ""; return; }
  const H = T().hero;
  const rows = {};
  p.rows.forEach(r => { rows[r.key] = r; });
  const sc = p.scenario || {};
  const conds = sc.conds || {};
  const ev = sc.evidence || {};
  const ctxByKey = {};
  (p.context || []).forEach(c => { ctxByKey[c.key] = c; });
  const s = [];

  // R1 — 이벤트 깃발 (서버 공급)
  const today = new Date(); today.setHours(0, 0, 0, 0);
  (p.events || []).forEach(evt => {
    const st = HERO_ST.find(t => t.key === evt.station);
    if (!st) return;
    const frm = new Date(evt.from + "T00:00:00");
    const to = new Date(evt.to + "T23:59:59");
    if (to < today) return;
    const d = Math.max(0, Math.ceil((frm - today) / 86400000));
    const live = today >= frm && today <= to;
    const txt = `⚑ ${evt.label} ${live ? H.dToday : "D-" + d}`;
    const fg = live ? "var(--warn)" : (d <= 3 ? "var(--ink)" : "var(--muted)");
    const w = d <= 3 || live ? "600" : "400";
    s.push(`<text x="${st.x}" y="28" text-anchor="middle" font-size="13"
      fill="${fg}" font-weight="${w}">${esc(txt)}</text>
      <line x1="${st.x}" y1="36" x2="${st.x}" y2="88" stroke="var(--line)" stroke-width="1"/>`);
  });

  // R2 — 노선: 트랙 + 점등 구간 + 역
  s.push(`<line x1="40" y1="182" x2="720" y2="182" stroke="var(--line)" stroke-width="3"/>`);
  for (let i = 0; i < HERO_ST.length - 1; i++) {
    const down = rows[HERO_ST[i + 1].key];
    const stt = down ? down.state : "unknown";
    if (stt === "moved" || stt === "alert") {
      const x1 = HERO_ST[i].x + 14, x2 = HERO_ST[i + 1].x - 14;
      s.push(`<line x1="${x1}" y1="182" x2="${x2}" y2="182"
        stroke="${ST_FG[stt]}" stroke-width="3" opacity="0.85"/>`);
      for (const f of [0.28, 0.52, 0.76]) {
        const cx = x1 + (x2 - x1) * f;
        s.push(`<path d="M ${cx - 4} 177 L ${cx + 4} 182 L ${cx - 4} 187 Z"
          fill="${ST_FG[stt]}" opacity="0.85"/>`);
      }
    }
  }
  HERO_ST.forEach(st => {
    const r = rows[st.key] || {};
    const stt = r.state || "unknown";
    const fg = ST_FG[stt] || ST_FG.unknown;
    const val = r.value == null ? "—" : r.value;
    // 노선도 역 라벨은 일중 항만 — '· BOJ 이후 …' 항까지 실으면 24자에서
    // 숫자가 잘려 매달린 라벨이 됩니다 (이벤트 Δ는 카드와 시나리오 패널에)
    let delta = (r.delta || "").split(" · ")[0];
    if (delta.length > 24) delta = delta.slice(0, 23) + "…";
    s.push(`<g><title>${esc((H.stations[st.key] || st.key) + " — " + (r.note || ""))}</title>
      <text class="t3" x="${st.x}" y="104" text-anchor="middle" font-size="13"
        fill="var(--mid)">${esc(H.stations[st.key] || st.key)}</text>
      <text x="${st.x}" y="138" text-anchor="middle" font-size="19"
        font-family="var(--mono)" fill="var(--ink)">${esc(val)}</text>
      <text class="t3" x="${st.x}" y="158" text-anchor="middle" font-size="10"
        font-family="var(--mono)"
        fill="${stt === "moved" || stt === "alert" ? fg : "var(--muted)"}">${esc(delta)}</text>`);
    if (stt === "alert") {
      s.push(`<circle class="pulse" cx="${st.x}" cy="182" r="15" fill="none"
        stroke="var(--alert)" stroke-width="2"/>`);
    }
    if (st.sw) {
      s.push(`<rect x="${st.x - 9}" y="173" width="18" height="18"
        transform="rotate(45 ${st.x} 182)"
        fill="${stt === "unknown" ? "var(--card)" : fg}"
        stroke="${stt === "unknown" ? "var(--muted)" : fg}" stroke-width="2"/>`);
    } else {
      s.push(`<circle cx="${st.x}" cy="182" r="9"
        fill="${stt === "unknown" ? "var(--card)" : fg}"
        stroke="${stt === "unknown" ? "var(--muted)" : fg}" stroke-width="2"/>`);
    }
    s.push(`<text x="${st.x}" y="186.5" text-anchor="middle" font-size="11"
      font-weight="700" fill="${stt === "unknown" ? "var(--ink)" : "var(--card)"}">${ST_GLYPH[stt]}</text>
      <text class="t3" x="${st.x}" y="212" text-anchor="middle" font-size="11"
        fill="var(--muted)">${esc(H.sub2[st.key] || "")}</text></g>`);
  });

  // 분기 스터브 + 라벨 (사실 표기 — 잉크 토큰만)
  const noRead = ev.d_spread_w_bp == null;
  const forkOn = k => !noRead && conds[k];
  const forkFg = k => noRead ? "var(--muted)" : (conds[k] ? "var(--ink)" : "var(--muted)");
  const forkW = k => forkOn(k) ? "700" : "400";
  // 분기: 스터브 2개는 항상 그리되(선택된 쪽만 굵게), 텍스트 라벨은
  // '선택된 방향 하나만' 표시 — 라벨 3개를 좁은 틈에 다 넣으면
  // 영어처럼 긴 문자열에서 이웃 열과 겹칩니다. 세 방향의 전체 목록은
  // 아래 행선판이 이미 보여줍니다.
  s.push(`<line x1="452" y1="182" x2="486" y2="164" stroke="${forkOn("widening") ? "var(--ink)" : "var(--line)"}" stroke-width="${forkOn("widening") ? 3 : 1.5}"/>
    <line x1="452" y1="182" x2="486" y2="200" stroke="${forkOn("narrowing") ? "var(--ink)" : "var(--line)"}" stroke-width="${forkOn("narrowing") ? 3 : 1.5}"/>`);
  let forkLabel;
  if (noRead) forkLabel = H.noRead;
  else if (conds.widening) forkLabel = H.fork.widening + " ↗";
  else if (conds.narrowing) forkLabel = H.fork.narrowing + " ↘";
  else if (conds.flat_spread) forkLabel = H.fork.flat + " →";
  if (forkLabel) {
    s.push(`<text class="t3" x="490" y="172" font-size="10" fill="var(--ink)"
      font-weight="700">${esc(forkLabel)}</text>`);
  }

  // 경로 리본 — 활성: 빨간 실선 / 기우는 중(유일 최다 부분): 점선
  const met = {};
  Object.keys(SC_CONDS).forEach(id => {
    met[id] = SC_CONDS[id].filter(c => conds[c]).length;
  });
  let ribbon = null, dashed = false;
  if (sc.active && sc.active !== "none") {
    ribbon = sc.active;
  } else {
    const max = Math.max(0, ...Object.values(met));
    const tops = Object.keys(met).filter(id => met[id] === max && max > 0);
    if (tops.length === 1) { ribbon = tops[0]; dashed = true; }
  }
  if (ribbon) {
    const xs = SC_CONDS[ribbon].map(c => COND_X[c]).filter(x => x);
    if (xs.length) {
      const x1 = Math.min(...xs) - 40, x2 = Math.max(...xs) + 40;
      s.push(`<line x1="${x1}" y1="196" x2="${x2}" y2="196"
        stroke="${dashed ? "var(--mid)" : "var(--alert)"}" stroke-width="3"
        opacity="${dashed ? 0.7 : 0.5}" ${dashed ? 'stroke-dasharray="6 4"' : ""}/>`);
    }
  }

  // R3 — 행선판 제목
  s.push(`<text x="12" y="266" font-size="12" fill="var(--muted)">${esc(H.destTitle)}</text>`);

  // R4 — 행선판 다섯 칸
  HERO_BOX.forEach(b => {
    const active = sc.active === b.id;
    const leaning = !active && dashed && ribbon === b.id;
    const m = met[b.id] || 0;
    const total = SC_CONDS[b.id].length;
    const boxStroke = active ? "var(--alert)" : leaning ? "var(--mid)" : "var(--line)";
    // 헤더: 제목(좌) + 짧은 카운트만(우) — 긴 단어는 겹칩니다.
    // 부분 충족은 카운트의 주의색이, 활성은 둘째 줄 '● 지금 여기'가 말합니다.
    s.push(`<g><title>${esc((T().sc[b.id] || {}).rule + " — " + (T().sc[b.id] || {}).note)}</title>
      <rect x="${b.x}" y="278" width="140" height="180" fill="var(--bg)"
        stroke="${boxStroke}" stroke-width="${active ? 3 : leaning ? 2 : 1.5}"
        ${leaning ? 'stroke-dasharray="6 4"' : ""}/>
      <text x="${b.x + 10}" y="302" font-size="13" font-weight="600"
        fill="${active ? "var(--alert)" : "var(--ink)"}">${esc(H.boxes[b.id])}</text>
      <text x="${b.x + 130}" y="302" text-anchor="end" font-size="11"
        font-family="var(--mono)"
        fill="${active ? "var(--alert)" : m > 0 ? "var(--warn)" : "var(--muted)"}"
        font-weight="${active || m > 0 ? 600 : 400}">${m}/${total}</text>`);
    if (active) {
      s.push(`<text x="${b.x + 10}" y="320" font-size="11" font-weight="700"
        fill="var(--alert)">● ${esc(H.now.trim().replace(/[:：]\s*$/, ""))}</text>`);
    } else if (leaning) {
      s.push(`<text x="${b.x + 10}" y="320" font-size="10" font-weight="600"
        fill="var(--mid)">◌ ${esc(H.lean.trim().replace(/[:：]\s*$/, ""))}</text>`);
    }
    SC_CONDS[b.id].forEach((c, i) => {
      const y = 342 + i * 32;
      const evTxt = condEvidence(c, ev);
      const unknown = evTxt == null;
      const on = !unknown && conds[c];
      s.push(`<circle cx="${b.x + 16}" cy="${y - 4}" r="6"
        fill="${on ? "var(--ink)" : "var(--bg)"}"
        stroke="${unknown ? "var(--muted)" : on ? "var(--ink)" : "var(--line)"}" stroke-width="1.5"/>`);
      if (unknown) s.push(`<text x="${b.x + 16}" y="${y - 0.5}" text-anchor="middle"
        font-size="9" fill="var(--muted)">?</text>`);
      // 근거 수치는 라벨 바로 아래 같은 들여쓰기 — 어느 조건의 숫자인지 명확하게
      s.push(`<text class="t3" x="${b.x + 28}" y="${y}" font-size="11"
        fill="${on ? "var(--ink)" : "var(--mid)"}" font-weight="${on ? 600 : 400}">${esc(H.conds[c] || c)}</text>
        <text class="t3" x="${b.x + 28}" y="${y + 12}" font-size="9"
        font-family="var(--mono)" fill="var(--muted)">${esc(evTxt == null ? "—" : evTxt)}</text>`);
    });
    const witnessKey = { s1: "btc", s2: "wti", s5: "gold" }[b.id];
    if (witnessKey) {
      const c = ctxByKey[witnessKey];
      if (c) {
        const attn = c.pct != null && Math.abs(c.pct) >= (CTX_ATTN[witnessKey] || 2);
        s.push(`<text class="t3" x="${b.x + 10}" y="414" font-size="10" fill="var(--mid)">${esc(c.name.split(" (")[0])}
            <tspan font-family="var(--mono)" fill="var(--ink)"> ${esc(c.value || "—")}</tspan>
            <tspan font-family="var(--mono)" font-size="9" fill="${attn ? "var(--warn)" : "var(--muted)"}"> ${esc((c.delta || "").split(" ")[0])}</tspan></text>
          <text class="t3" x="${b.x + 10}" y="434" font-size="9" fill="var(--muted)">${esc(H.witness[b.id] || "")}</text>`);
      }
    }
    s.push(`</g>`);
  });

  // 판정 헤드라인 (HTML)
  let verdict, vColor;
  if (sc.active && sc.active !== "none") {
    verdict = H.now + H.boxes[sc.active] + " — " + (T().sc[sc.active] || {}).rule;
    vColor = "var(--alert)";
  } else if (ribbon) {
    verdict = H.lean + H.boxes[ribbon] + ` (${met[ribbon]}/${SC_CONDS[ribbon].length})` +
      " · " + H.wait;
    vColor = "var(--mid)";
  } else {
    verdict = H.wait + " — " + T().scWait.split("—")[1];
    vColor = "var(--mid)";
  }

  el.innerHTML = `<div class="panel" style="position:relative">
    <h2>${esc(H.title)}</h2>
    <div style="font-size:14px;font-weight:600;color:${vColor};margin:2px 0 2px">${esc(verdict)}</div>
    <div style="font-size:12px;color:var(--muted);margin:0 0 8px">${esc(H.sub)}</div>
    <svg viewBox="0 0 760 470" width="100%" preserveAspectRatio="xMidYMid meet"
      role="img" aria-label="${esc(H.title)}">${s.join("")}</svg>
  </div>`;
}

// 보조 지표 타일 — 델타 색은 방향 판단 없이 '오늘 크게 움직임'만 주의색으로
const CTX_ATTN = { wti: 2, gold: 2, btc: 3 };  // |%| 주의 임계

function renderContext(p) {
  const el = document.getElementById("context");
  if (!el) return;
  const ctx = p.context || [];
  if (!ctx.length) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="ctxgrid">` + ctx.map(c => {
    const attn = c.attn === true
      || (c.pct != null && Math.abs(c.pct) >= (CTX_ATTN[c.key] || 2));
    return `<div class="ctxtile">
      <div class="ctxname">${esc(c.name)}</div>
      <div class="ctxval">${esc(c.value == null ? "—" : c.value)}${c.delta
        ? `<span class="ctxdelta" style="color:${attn ? "var(--warn)" : "var(--muted)"}">${esc(c.delta)}</span>` : ""}</div>
      <div class="ctxspark" id="ctx-spark-${esc(c.key)}"></div>
      <div class="ctxmeaning">${esc(c.meaning)}</div>
    </div>`;
  }).join("") + `</div>`;
  fillContextSparks();
}

function fillContextSparks() {
  if (!INTRADAY || !INTRADAY.points) return;
  for (const key of ["wti", "gold", "btc"]) {
    const el = document.getElementById("ctx-spark-" + key);
    if (!el) continue;
    const vals = INTRADAY.points.map(p => p[key]).filter(v => typeof v === "number");
    if (vals.length < 3) { el.innerHTML = ""; continue; }
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const W = 200, H = 26;
    const d = vals.map((v, i) =>
      (i ? "L" : "M") + (i / (vals.length - 1) * W).toFixed(1) + " "
      + (H - (v - lo) / span * H).toFixed(1)).join(" ");
    el.innerHTML = `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
      style="height:26px;display:block"><path d="${d}" fill="none"
      stroke="var(--muted)" stroke-width="1.4"/></svg>`;
  }
}

// 실질/BEI 분해 — 명목 금리 상승의 **원인**을 부호로 가릅니다.
// 표시 전용: 판별 게이트에는 불참합니다 (이벤트 기준값과 같은 등급).
function beiBlock(ev) {
  const b = ev.bei;
  if (!b || b.nom10 == null) return "";
  const H = T();
  const lab = (H.beiLabels || {})[b.label] || "";
  return `<div style="font-size:11px;color:var(--muted);margin-top:6px;
    border-top:1px solid var(--line);padding-top:6px">${esc(H.beiLine(b))}
    ${lab ? `<div style="margin-top:2px;color:var(--mid)">${esc(lab)}</div>` : ""}</div>`;
}

// BOJ 정책금리 + 예측시장 — 표시 전용. 판정·경보 불참.
function bojBlock(ev) {
  const b = ev.boj; if (!b) return "";
  const H = T();
  return `<div style="font-size:11px;color:var(--muted);margin-top:4px">
    ${esc(H.bojLine(b))}${b.pending ? ` — ${esc(H.bojPending)}` : ""}</div>`;
}

// 유동성과 마지막 호가 시각을 값과 **같은 급**으로 병기합니다. 최상단 잔량이
// 세 자리 달러인 시장의 mid 를 '확률'로 띄우면 거짓 정밀도입니다.
function pmktBlock(ev) {
  const pm = ev.pmkt; if (!pm || !(pm.items || []).length) return "";
  const H = T();
  const rows = pm.items.map(i => `<div style="margin-top:6px">
      <span style="color:var(--ink)">${esc(H.pmRow(i))}</span>
      ${i.thin ? `<span class="pill" style="color:var(--warn);background:var(--warn-bg);
        margin-left:6px">${esc(H.pmThin)}</span>` : ""}
      <div style="color:var(--muted)">${esc(H.pmLiq(i))}</div></div>`).join("");
  return `<div class="panel" style="margin-top:14px">
    <h2>${esc(H.pmTitle)}</h2>
    <div style="font-size:11px;color:var(--muted)">${esc(H.pmNote)}</div>
    <div style="font-size:12px">${rows}</div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">${esc(H.pmCaveat)}</div>
    <div style="font-size:11px;color:var(--muted);margin-top:2px">${fmtAbs(pm.at)}</div></div>`;
}

function renderScenario(p) {
  const el = document.getElementById("scenario");
  if (!el) return;
  const sc = p.scenario;
  if (!sc) { el.innerHTML = ""; return; }
  const rows = ["s1", "s2", "s3", "s4", "s5"].map(id => {
    const meta = T().sc[id];
    const conds = SC_CONDS[id];
    const met = conds.filter(c => sc.conds && sc.conds[c]).length;
    const on = sc.active === id;
    const partial = !on && sc.active === "none" && met > 0;
    const badge = on
      ? `<span class="pill" style="color:${S.alert.fg};background:${S.alert.bg}">${T().scActive}</span>`
      : partial
      ? `<span class="pill" style="color:${S.moved.fg};background:${S.moved.bg}">${T().scPartial} ${met}/${conds.length}</span>`
      : "";
    const ruleStyle = on ? `color:${S.alert.fg};font-weight:600`
                    : partial ? `color:${S.moved.fg}` : "";
    return `<tr>
      <td class="k" style="width:32%">${esc(meta.name)}${badge ? "&nbsp;" + badge : ""}</td>
      <td><span style="${ruleStyle}">${esc(meta.rule)}</span>
        <div style="font-size:11px;color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif">${esc(meta.note)}</div></td></tr>`;
  }).join("");
  const reg = (T().scRegime || {})[(sc.evidence || {}).regime];
  const head = `<div style="font-size:12px;color:var(--muted);margin:0 0 10px">${esc(T().scIntro)}</div>`
    + (sc.active === "none"
       ? `<div style="font-size:12px;color:var(--mid);margin:0 0 10px">${esc(T().scWait)}`
         + (reg ? ` ${esc(reg)}` : "") + `</div>` : "");
  el.innerHTML = `<div class="panel">
    <h2>${esc(T().scTitle)}</h2>${head}<table>${rows}</table>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">${T().scEvid(sc.evidence || {})}</div>
    ${(sc.evidence || {}).event ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">${T().scEvent(sc.evidence.event)}</div>` : ""}
    ${beiBlock(sc.evidence || {})}
    ${bojBlock(sc.evidence || {})}
  </div>` + pmktBlock(sc.evidence || {});
}

function sparkline(hist) {
  const pts = hist.filter(h => typeof h[1] === "number");
  if (pts.length < 3) return "";
  const vals = pts.map(p => p[1]);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = hi - lo || 1;
  const W = 320, H = 40;
  const d = vals.map((v, i) => {
    const x = (i / (vals.length - 1)) * W;
    const y = H - ((v - lo) / span) * H;   // 값이 낮을수록(엔 강세) 아래
    return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }).join(" ");
  return `<div class="spark"><svg width="100%" viewBox="0 0 ${W} ${H}"
      preserveAspectRatio="none" style="height:40px;display:block">
      <path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.2"/>
    </svg>
    <div style="display:flex;justify-content:space-between;font-family:var(--mono);
                font-size:11px;color:var(--muted);margin-top:2px">
      <span>${pts[0][0].slice(0,10)}</span>
      <span>${T().sparkHiLo(hi.toFixed(2), lo.toFixed(2))}</span>
    </div></div>`;
}

function render(p) {
  const snap = p.snapshot || {};
  document.getElementById("sub").textContent =
    (snap.at ? T().lastCheck + fmtAbs(snap.at) + " (" + ago(snap.at) + ")" : T().noData) +
    (p.baseline && p.baseline.date ? T().baseDay + p.baseline.date : "") +
    (window.SNAPSHOT ? " · " + T().snapshot(fmtAbs(SNAPSHOT.generated) + " (" + ago(SNAPSHOT.generated) + ")") : "");

  // 전원 경고 — 상태색이 아니라 경고색. 사실이지만 조치가 필요한 사실입니다.
  const pwEl = document.getElementById("power");
  if (pwEl) {
    const pw = p.power || {};
    pwEl.innerHTML = pw.src === "battery"
      ? `<div class="banner" style="border-color:var(--warn);background:var(--warn-bg);
           margin-top:12px;padding:10px 14px;font-size:13px;color:var(--warn)">
           ${esc(T().pwrBattery(pw))}</div>` : "";
  }
  const alerts = p.rows.filter(r => r.state === "alert").length;
  const moved  = p.rows.filter(r => r.state === "moved").length;
  const st = alerts ? S.alert : (moved ? S.moved : S.calm);
  const n = alerts || moved;
  const msg = alerts ? T().bannerAlert
            : moved ? T().bannerMoved
            : T().bannerCalm;

  // 어느 지표인지 배너가 직접 말해줍니다 — 스캔해서 찾게 하지 않기
  const hot = alerts ? p.rows.filter(r => r.state === "alert")
            : p.rows.filter(r => r.state === "moved");
  document.getElementById("banner").innerHTML = !snap.at ? "" :
    `<div class="banner" style="background:${st.bg};border-color:${st.fg}">
       <div style="display:flex;align-items:baseline;gap:12px">
         <span class="n" style="color:${st.fg}">${n}</span>
         <span class="msg">${msg}</span>
       </div>
       ${hot.length ? `<div style="font-size:13px;font-weight:500;color:${st.fg};margin-top:6px">
          ${hot.map(r => esc(r.name)).join(" · ")}</div>` : ""}
       ${p.failures >= 4 ? `<div style="font-size:12px;color:var(--alert);margin-top:10px">
          ${T().failNote(p.failures)}</div>` : ""}
     </div>`;

  renderJourney(p);
  renderHero(p);
  renderScenario(p);
  renderContext(p);

  // 신선도 표기 — 헤더의 '마지막 확인 N분 전'은 **수집 시각**이고, 값 자체는
  // 장 마감·주말·지연 소스 탓에 훨씬 묵을 수 있습니다(실측 최대 50.2시간).
  // 그 차이를 숨기면 독자가 종가를 '지금'으로 읽습니다.
  function freshNote(r) {
    const f = r.fresh;
    if (!f) return "";
    const bits = [];
    const H = T();
    if (f.delay) bits.push(`${esc(f.src || "")} — ${esc(f.delay)}`);
    if (f.obs) bits.push(H.freshObs.replace("{d}", esc(f.obs)));
    if (f.frozen_h != null && f.frozen_h >= 2) {
      bits.push(H.freshFrozen.replace("{h}",
        f.frozen_h >= 24 ? (f.frozen_h / 24).toFixed(1) + H.freshDay
                         : f.frozen_h.toFixed(1) + H.freshHour));
    }
    if (!bits.length) return "";
    // 상태색이 아니라 잉크/보조색 — 신선도는 좋음/나쁨이 아니라 사실입니다
    const strong = (f.frozen_h != null && f.frozen_h >= 12) || f.delay;
    return `<div class="note" style="color:var(${strong ? "--warn" : "--muted"});
      font-size:11px;margin-top:2px">${H.freshPrefix}${bits.join(" · ")}</div>`;
  }

  document.getElementById("rows").innerHTML = p.rows.map(r => {
    const s = S[r.state] || S.unknown;
    const spark = r.key === "usdjpy" ? sparkline(p.history || []) : "";
    const link = r.key === "mof"
      ? `<div style="margin-top:8px;font-size:12px"><a href="${esc(p.mof_url)}"
           target="_blank" rel="noreferrer">${T().mofLink}</a></div>` : "";
    return `<div class="row" style="border-left-color:${s.fg}">
      <div class="top">
        <span class="name">${esc(r.name)}</span>
        <span class="pill" style="color:${s.fg};background:${s.bg}">${T().st[r.state] || T().st.unknown}</span>
        <span class="ref">${esc(r.ref || "")}</span>
      </div>
      <div class="meaning">${esc(r.meaning)}</div>
      <div class="figures">
        <span class="val">${esc(r.value)}</span>
        ${r.delta ? `<span class="delta" style="color:${s.fg}">${esc(r.delta)}</span>` : ""}
      </div>
      <div class="note">${esc(r.note)}</div>
      ${freshNote(r)}
      ${r.eli ? `<div class="roweli">${esc(r.eli)}</div>` : ""}
      ${spark}${link}
    </div>`;
  }).join("");

  // 필이 이미 등급을 말하므로 제목의 [경보]/[해제] 접두사는 중복 — 떼고,
  // 해제 문구에 남은 내부 키(jpy_3bd 등)는 사람이 읽는 이름으로 바꿉니다
  const logTitle = e => {
    let t = String(e.title || "").replace(/^\[[^\]]+\]\s*/, "");
    const map = T().keyNames;
    for (const k in map) t = t.split(k).join(map[k]);
    return t;
  };
  const logHtml = (p.alert_log && p.alert_log.length)
    ? p.alert_log.map((e, i) => {
        const s = { alert: S.alert, move: S.moved, clear: S.calm, ops: S.unknown }[e.level] || S.unknown;
        const label = T().lg[e.level] || T().lg.ops;
        const body = esc(e.body || "");
        return `<tr class="logrow" data-i="${i}" title="${body}">
          <td class="k" style="width:22%">${ago(e.at)}
            <div style="font-size:10px;color:var(--muted)">${fmtAbs(e.at)}</div></td>
          <td><span class="pill" style="color:${s.fg};background:${s.bg}">${label}</span>
            ${esc(logTitle(e))}
            ${body ? `<div class="logbody" hidden>${body}</div>` : ""}</td></tr>`;
      }).join("")
    : `<tr><td class="k" style="width:22%">—</td><td>${T().histEmpty}</td></tr>`;

  // 관련 뉴스 — 요약(있으면) + 출처가 명시된 헤드라인 목록
  const news = p.news || {};
  const digest = news.digest;
  const digestHtml = digest && (digest[LANG] || digest.ko)
    ? `<div style="font-size:13px;color:var(--mid);line-height:1.7;margin:0 0 6px">
        ${esc(digest[LANG] || digest.ko)}</div>
       <div style="font-size:10px;color:var(--muted);margin:0 0 12px">
        ${esc(T().newsDigestNote(digest.model || "?", fmtAbs(digest.at) + " (" + ago(digest.at) + ")"))}</div>`
    : "";
  const newsRows = (news.items && news.items.length)
    ? news.items.map(n => {
        // 이중 방어: 서버 필터를 지나쳐도 http(s) 외 URL 은 링크로 만들지 않음
        const safe = /^https?:\/\//i.test(n.url || "");
        const titleHtml = safe
          ? `<a href="${esc(n.url)}" target="_blank" rel="noreferrer">${esc(n.title)}</a>`
          : esc(n.title);
        return `<tr>
        <td class="k" style="width:22%">${ago(n.at)}
          <div style="font-size:10px;color:var(--muted)">${esc(n.source || "")}</div></td>
        <td>${((n.tags && n.tags.length) ? n.tags : (n.tag ? [n.tag] : []))
          .map(t => `<span class="pill" style="color:var(--mid);background:var(--bg)">${esc(t)}</span> `)
          .join("")}${titleHtml}
          <span style="font-size:10px;color:var(--muted)">· ${esc((n.lang || "").toUpperCase())}</span></td></tr>`;
      }).join("")
    : `<tr><td class="k" style="width:22%">—</td><td>${T().newsEmpty}</td></tr>`;
  const newsPanel = `
    <div class="panel">
      <h2>${T().newsTitle}${news.updated ? `<span style="font-weight:400;font-size:11px;color:var(--muted)"> · ${T().newsUpdated} ${fmtAbs(news.updated)} (${ago(news.updated)})</span>` : ""}</h2>
      ${digestHtml}
      <table>${newsRows}</table>
      <div style="font-size:11px;color:var(--muted);margin-top:10px">${esc(T().newsProv)}</div>
    </div>`;

  const t = p.thresholds || {};
  document.getElementById("extra").innerHTML = `
    <div class="panel">
      <h2>${T().histTitle}</h2>
      <div style="font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.7">
        ${T().histEli}
      </div>
      <table>${logHtml}</table>
      <div style="font-size:12px;color:var(--muted);margin-top:10px">
        ${T().histNote}
      </div>
    </div>
    ${newsPanel}
    <div class="panel">
      <h2>${T().thTitle}</h2>
      <table>
        <tr><td class="k">${T().th30}</td><td>${t.us30y}%</td></tr>
        <tr><td class="k">${T().thSp}</td><td>${t.spread_bp}bp</td></tr>
        <tr><td class="k">${T().thJpy}</td><td>${t.jpy_3bd}${LANG === "ko" ? "엔" : " yen"}</td></tr>
        <tr><td class="k">${T().thJgb}</td><td>${t.jgb10y || "—"}%</td></tr>
        <tr><td class="k">${T().thActive}</td><td>${p.active.length ? esc(p.active.join(", ")) : T().thNone}</td></tr>
      </table>
      <div style="font-size:12px;color:var(--muted);margin-top:10px">
        ${T().thNote}
      </div>
    </div>`;

  // 모바일엔 hover 가 없습니다 — 행을 탭하면 상세가 펼쳐지게
  document.querySelectorAll("#extra .logrow").forEach(tr => {
    tr.onclick = () => {
      const b = tr.querySelector(".logbody");
      if (b) b.hidden = !b.hidden;
    };
  });
}


// ── 추세 차트 ─────────────────────────────────────────────
// RANGE ≤ 7일이면 감시기가 15분마다 직접 기록한 값(/api/intraday),
// 그보다 길면 FRED 일별 확정치(/api/series)를 그립니다.
// 지표마다 물리적으로 가능한 최소 샘플링: 미 금리·달러엔·달러지수 = 15분(수집 주기),
// JGB = 하루 1번(다음 영업일 08:30 JST 확정), 재무성 순매수 = 주 1번.
let SERIES = null;
let INTRADAY = null;
let RANGE = 1;

const PANELS = [
  { key: "us30y", unit: "%", dec: 3, threshold: true,
    title: { ko: "미 국채 30년물", en: "US 30-Year Treasury" },
    live: { ko: "15분", en: "15 min" },
    eli: { ko: "미국이 30년짜리로 돈을 빌릴 때 주는 이자예요. 일본 큰손들이 미국 채권을 팔고 떠나면 이 선이 위로 뛰어요. 빨간 점선을 넘으면 경보.",
           en: "The interest the US pays to borrow for 30 years. When Japan's big investors sell US bonds and leave, this line jumps. Crossing the red dashed line = alert." } },
  { key: "spread", unit: "bp", dec: 1, zero: true,
    title: { ko: "10년 − 2년 금리차", en: "10Y − 2Y Spread" },
    live: { ko: "15분", en: "15 min" },
    eli: { ko: "10년 이자에서 2년 이자를 뺀 값이에요. 위로 벌어지면 긴 채권을 팔고 있다는 뜻(구조적 이탈), 아래로 좁혀지면 무서워서 안전한 곳으로 숨는다는 뜻(캐리 청산) — 같은 사건의 두 얼굴을 구분해 줘요.",
           en: "The 10-year rate minus the 2-year rate. Widening (up) means long bonds are being sold (structural exit); narrowing (down) means hiding in safety (carry unwind) — it tells apart the two faces of the same event." } },
  { key: "usdjpy", unit: "", dec: 2, invert: true,
    title: { ko: "달러엔", en: "USD/JPY" },
    live: { ko: "15분", en: "15 min" },
    eli: { ko: "1달러로 살 수 있는 엔의 양이에요. 선이 내려가면 엔이 강해지는 것 — 빌린 엔을 급하게 갚으려는 사람이 많다는 신호일 수 있어요.",
           en: "How many yen one dollar buys. A falling line means a stronger yen — possibly many people rushing to repay borrowed yen." } },
  { key: "dxybroad", unit: "", dec: 2, intradayKey: "dxy",
    title: { ko: "달러 실효환율 (FRED 광의지수)", en: "Broad Dollar (FRED)" },
    intradayTitle: { ko: "달러지수 (DXY)", en: "Dollar Index (DXY)" },
    live: { ko: "15분", en: "15 min" },
    eli: { ko: "달러의 전체적인 힘이에요. 보통 미국 이자가 오르면 달러도 세지는데, 이자만 오르고 달러가 약해지면 돈이 미국을 떠나고 있다는 뜻이라 제일 조심해야 해요.",
           en: "The dollar's overall strength. Usually higher US rates mean a stronger dollar; if rates rise while the dollar weakens, money is leaving the US — the combination to watch most." } },
  { key: "jgb10y", unit: "%", dec: 3, intradayOnly: true,
    title: { ko: "일본 국채 10년물", en: "JGB 10-Year" },
    live: { ko: "하루 1번", en: "daily" },
    eli: { ko: "일본이 10년짜리로 돈을 빌릴 때 주는 이자예요. 이게 오르면 일본 큰손들이 '집에서도 이자를 잘 주네?' 하며 돈을 데려갈 이유가 생겨요.",
           en: "The interest Japan pays to borrow for 10 years. As it rises, Japan's big investors gain a reason to bring their money back home." } },
  { key: "wti", unit: "", dec: 2, intradayOnly: true,
    title: { ko: "원유 (WTI)", en: "Crude Oil (WTI)" },
    live: { ko: "15분", en: "15 min" },
    eli: { ko: "기름값이 오르면 물가가 다시 뛰어 연준이 금리를 내리기 어려워져요 — '최선' 시나리오(②)가 멀어집니다.",
           en: "Pricier oil rekindles inflation and makes Fed easing harder — pushing the best-case box (②) further away." } },
  { key: "gold", unit: "", dec: 0, intradayOnly: true,
    title: { ko: "금 (COMEX)", en: "Gold (COMEX)" },
    live: { ko: "15분", en: "15 min" },
    eli: { ko: "달러도 약하고 금리도 오르는데 금까지 오르면, 돈이 '신뢰'를 찾아 떠난다는 신호(⑤)예요.",
           en: "Gold rising while the dollar weakens and yields climb signals money fleeing to trust (⑤)." } },
  { key: "btc", unit: "", dec: 0, intradayOnly: true,
    title: { ko: "비트코인", en: "Bitcoin" },
    live: { ko: "15분", en: "15 min" },
    eli: { ko: "위험자산의 탄광 속 카나리아 — 캐리 청산(①)이 시작되면 기술주보다 먼저 휘청이곤 해요.",
           en: "The canary of risk assets — often wobbles before tech stocks when carry unwinding (①) begins." } },
];

function drawChart(pts, opt) {
  const W = 640, H = 130, PADL = 44, PADR = 8, PADT = 8, PADB = 16;
  const iw = W - PADL - PADR, ih = H - PADT - PADB;
  const vals = pts.map(p => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (opt.threshold && TH != null) { lo = Math.min(lo, TH); hi = Math.max(hi, TH); }
  if (opt.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  // 값이 거의 평평하면 축 눈금이 같은 숫자 세 개가 됩니다 — 최소 스팬을 보장
  const minSpan = Math.max(Math.abs(hi), Math.abs(lo), 1) * 0.004;
  if (hi - lo < minSpan) {
    const c = (hi + lo) / 2;
    lo = c - minSpan / 2; hi = c + minSpan / 2;
  }
  const pad = (hi - lo) * 0.08 || 0.5;
  lo -= pad; hi += pad;
  const span = hi - lo || 1;
  const X = i => PADL + (i / Math.max(pts.length - 1, 1)) * iw;
  const Y = v => PADT + ih - ((v - lo) / span) * ih;

  const d = pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  const area = d + ` L ${X(pts.length - 1).toFixed(1)} ${(PADT + ih).toFixed(1)}`
                 + ` L ${X(0).toFixed(1)} ${(PADT + ih).toFixed(1)} Z`;

  let extra = "";
  if (opt.threshold && TH != null) {
    const y = Y(TH).toFixed(1);
    extra += `<line x1="${PADL}" y1="${y}" x2="${W - PADR}" y2="${y}"
      stroke="var(--alert)" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>
      <text x="${W - PADR}" y="${(+y - 4)}" text-anchor="end"
        font-size="10" fill="var(--alert)" font-family="var(--mono)">${T().thLine}${TH}</text>`;
  }
  if (opt.zero) {
    const y = Y(0).toFixed(1);
    extra += `<line x1="${PADL}" y1="${y}" x2="${W - PADR}" y2="${y}"
      stroke="var(--line)" stroke-width="1"/>`;
  }

  const ticks = [hi - pad, (hi + lo) / 2, lo + pad].map(v =>
    `<text x="${PADL - 6}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end"
       font-size="10" fill="var(--muted)" font-family="var(--mono)">${v.toFixed(opt.dec)}</text>
     <line x1="${PADL}" y1="${Y(v).toFixed(1)}" x2="${W - PADR}" y2="${Y(v).toFixed(1)}"
       stroke="var(--line)" stroke-width=".5" opacity=".6"/>`).join("");

  const lastX = X(pts.length - 1).toFixed(1), lastY = Y(vals[vals.length - 1]).toFixed(1);

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
    style="width:100%;height:${H}px;display:block">
    ${ticks}${extra}
    <path d="${area}" fill="var(--ink)" opacity=".05"/>
    <path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.4"
      stroke-linejoin="round" opacity=".8"/>
    <circle cx="${lastX}" cy="${lastY}" r="2.6" fill="var(--ink)"/>
  </svg>`;
}

let TH = null;

function clip(pts, days) {
  if (!pts || !pts.length) return [];
  const cutoff = new Date(Date.now() - days * 86400000);
  const out = pts.filter(p =>
    new Date(p[0].includes("T") ? p[0] : p[0] + "T00:00:00Z") >= cutoff);
  return out.length >= 2 ? out : pts.slice(-Math.min(pts.length, 30));
}

function fmtX(t) {
  // 일별 데이터는 날짜 그대로. 15분 데이터는 **로컬 시간대로 변환**합니다 —
  // 원문(UTC) 문자열을 잘라 쓰면 화면 나머지(헤더·경보 이력·여정표·뉴스는
  // 모두 로컬)와 어긋납니다. EDT 에서는 4시간, 서머타임 종료 후엔 5시간.
  // 표기가 없으면 오차의 존재조차 알 수 없어, 발표 전 드리프트를 발표 후
  // 반응으로 오독합니다 (FOMC 14:00 ET 를 차트에서 18:02 로 찾게 됩니다).
  if (!t || !t.includes("T")) return t || "";
  const d = new Date(t);
  if (isNaN(d)) return t.slice(5, 16).replace("T", " ");
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function tzLabel() {
  // 짧은 시간대 이름 (EDT/KST 등). 못 구하면 UTC 오프셋으로.
  try {
    const s = new Intl.DateTimeFormat(undefined, { timeZoneName: "short" })
      .formatToParts(new Date()).find(x => x.type === "timeZoneName");
    if (s && s.value) return s.value;
  } catch (e) { /* 구형 브라우저 */ }
  const off = -new Date().getTimezoneOffset() / 60;
  return "UTC" + (off >= 0 ? "+" : "") + off;
}

function seriesFor(panel) {
  if (RANGE <= 7) {
    const key = panel.intradayKey || panel.key;
    return ((INTRADAY && INTRADAY.points) || [])
      .map(p => [p.at, panel.key === "spread" && p[key] != null
                       ? p[key] * 100 : p[key]])
      .filter(p => typeof p[1] === "number");
  }
  if (panel.intradayOnly) return [];
  return (SERIES && SERIES.series && SERIES.series[panel.key]) || [];
}

function renderCharts(thresholds) {
  const box = document.getElementById("charts");
  const parts = [];
  const intra = RANGE <= 7;

  for (const panel of PANELS) {
    const title = LL(intra && panel.intradayTitle ? panel.intradayTitle : panel.title);
    const unitNote = intra ? `${LL(panel.live)}${T().unitGap}` : T().unitDaily;
    const all = seriesFor(panel);
    const pts = clip(all, RANGE);

    if (pts.length < 2) {
      if (intra) parts.push(`<div class="chart">
        <div class="head"><span>${title}</span>
          <span class="last" style="color:var(--muted)">${unitNote}</span></div>
        <div class="eli">${LL(panel.eli)}</div>
        <div style="font-size:12px;color:var(--muted);padding:8px 0">
          ${T().accumulating(all.length)}</div>
      </div>`);
      continue;
    }
    TH = panel.threshold ? (thresholds && thresholds.us30y) : null;
    // 1일·1주 미시 화면에서 0-앵커는 41bp 선을 천장에 붙여버립니다 —
    // 절대 수준은 카드가 이미 보여주므로, 짧은 구간에선 움직임을 보여줍니다
    const drawOpt = intra && panel.zero ? { ...panel, zero: false } : panel;
    const first = pts[0][1], last = pts[pts.length - 1][1];
    const ch = last - first;
    // 달러엔은 값이 내려가는 게 엔 강세
    const good = panel.invert ? ch < 0 : null;
    const col = ch === 0 ? "var(--muted)"
              : (good === null ? "var(--mid)" : (good ? "var(--calm)" : "var(--warn)"));
    const chTxt = panel.key === "spread"
      ? `${ch >= 0 ? "+" : ""}${ch.toFixed(1)}bp`
      : `${ch >= 0 ? "+" : ""}${ch.toFixed(panel.dec)}${panel.unit}`;

    parts.push(`<div class="chart">
      <div class="head">
        <span>${title}
          <span style="color:var(--muted);font-size:11px">· ${unitNote}</span></span>
        <span class="last">${last.toFixed(panel.dec)}${panel.unit}
          <span style="color:${col}">${chTxt}</span></span>
      </div>
      <div class="eli">${LL(panel.eli)}</div>
      ${drawChart(pts, drawOpt)}
      <div class="axis"><span>${fmtX(pts[0][0])}</span>
        ${RANGE <= 7 ? `<span style="color:var(--muted)">${esc(tzLabel())}</span>` : ""}
        <span>${fmtX(pts[pts.length-1][0])}</span></div>
    </div>`);
  }

  if (!parts.length) {
    box.innerHTML = `<div style="font-size:13px;color:var(--mid);padding:12px 0">
      ${T().noSeries}</div>`;
  } else {
    box.innerHTML = parts.join("");
  }
  document.getElementById("charts-panel").style.display = "";

  fillContextSparks();

  const note = document.getElementById("series-note");
  if (intra) {
    const n = (INTRADAY && INTRADAY.points || []).length;
    note.textContent = T().intraNote(n);
  } else {
    const u = SERIES && SERIES.updated ? new Date(SERIES.updated) : null;
    note.textContent = T().dailyNote
      + (u ? " · " + ago(SERIES.updated) + T().updatedAgo : "")
      + T().dailyCaveat;
  }
}

function renderRanges(thresholds) {
  const opts = T().ranges;
  document.getElementById("ranges").innerHTML = opts.map(([d, l]) =>
    `<button class="rbtn ${d === RANGE ? "on" : ""}" data-d="${d}">${l}</button>`).join("");
  document.querySelectorAll("#ranges .rbtn").forEach(b => {
    b.onclick = () => { RANGE = +b.dataset.d; renderRanges(thresholds); renderCharts(thresholds); };
  });
}

async function refreshIntraday(thresholds) {
  try {
    const r = await fetch("/api/intraday");
    INTRADAY = await r.json();
    if (RANGE <= 7) renderCharts(thresholds);
  } catch (e) { /* 차트만 생략 */ }
}

async function loadSeries(thresholds) {
  try {
    const [rs, ri] = await Promise.all([fetch("/api/series"), fetch("/api/intraday")]);
    SERIES = await rs.json();
    INTRADAY = await ri.json();
    renderRanges(thresholds);
    renderCharts(thresholds);
  } catch (e) { /* 차트만 생략 */ }
}

function applyI18N() {
  document.title = T().docTitle;
  document.documentElement.lang = LANG;
  document.getElementById("title").textContent = T().title;
  const lb = document.getElementById("langbtn");
  lb.textContent = T().langBtn;
  lb.title = T().langTitle;
  document.getElementById("check").textContent = T().checkNow;
  document.getElementById("foot").textContent =
    window.SNAPSHOT ? T().footSnap : T().foot;
  const sub = document.getElementById("sub");
  if (sub && (!sub.textContent || sub.textContent === "불러오는 중" || sub.textContent === "loading"))
    sub.textContent = T().loading;
  const tt = document.getElementById("trend-title");
  if (tt) tt.textContent = T().trend;
}

async function load() {
  // 정적 스냅샷 모드: 서버 없이 심어 둔 데이터로 그립니다 (공유용)
  if (window.SNAPSHOT) {
    const p = SNAPSHOT.state[LANG] || SNAPSHOT.state.ko;
    THRESH = p.thresholds;
    render(p);
    SERIES = SNAPSHOT.series || null;
    INTRADAY = SNAPSHOT.intraday || null;
    renderRanges(THRESH);
    renderCharts(THRESH);
    document.getElementById("check").style.display = "none";
    return;
  }
  try {
    const r = await fetch("/api/state?lang=" + LANG);
    const p = await r.json();
    if (!p.rows || !p.rows.length || !p.snapshot || !p.snapshot.at) {
      document.getElementById("rows").innerHTML =
        `<div class="row empty">${T().noRows}</div>`;
      document.getElementById("sub").textContent = T().noData;
      return;
    }
    THRESH = p.thresholds;
    render(p);
    if (!SERIES) loadSeries(p.thresholds);
    else refreshIntraday(p.thresholds);
  } catch (e) {
    document.getElementById("sub").textContent = T().connFail;
  }
}

document.getElementById("check").onclick = async function () {
  const b = this;
  b.disabled = true; b.textContent = T().checking;
  try {
    // POST + 커스텀 헤더 — GET 이면 아무 페이지의 <img> 한 줄이 실운영
    // 사이클을 강제 실행할 수 있습니다 (감사 중 실제로 유발됨)
    await fetch("/api/check", {
      method: "POST", headers: { "X-YenCheck-Local": "1" },
    });
  } catch (e) { /* 결과는 load 에서 확인 */ }
  await load();
  b.disabled = false; b.textContent = T().checkNow;
};

document.getElementById("langbtn").onclick = function () {
  LANG = LANG === "ko" ? "en" : "ko";
  try { localStorage.setItem("yenmon:lang", LANG); } catch (e) {}
  applyI18N();
  load();
  if (THRESH) { renderRanges(THRESH); renderCharts(THRESH); }
};

applyI18N();
load();
if (!window.SNAPSHOT) setInterval(load, 60000);
</script>
